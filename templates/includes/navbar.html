<nav class="navbar" id="navbar">
    <a href="{% url "home" %}" class="nav-logo">Mood Tracker</a>
    <div class="nav-links">
        {% if user.is_authenticated %}
            <a href="{% url "journal:journal-entry-list" %}">Journal</a>
        {% else %}
            <a href="#journal">Journal</a>
        {% endif %}
        <a href="#reflection">Reflection</a>
        {% if user.is_authenticated %}
            <a href="{% url "account:profile" user.id %}">Profile</a>
            <form method="post" action="{% url "logout" %}" class="logout-form">
                {% csrf_token %}
                <button type="submit" class="nav-cta">Logout →</button>
            </form>
        {% else %}
            <a href="{% url "login" %}">Login</a>
            <a href="{% url "register" %}" class="nav-cta">Get started →</a>
        {% endif %}
    </div>
</nav>
