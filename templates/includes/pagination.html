{% if is_paginated %}
  <div class="journal-top">
    {% if page_obj.has_previous %}
      <a href="?page={{ page_obj.previous_page_number }}" class="primary-btn">← Newer</a>
    {% endif %}
    {% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}" class="primary-btn">Older →</a>{% endif %}
  </div>
{% endif %}
